<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Mazkiplay Agent Office</title><desc id="desc">Neon navy office dashboard with animated signal rings, floating desks, and a glowing Mazkiplay wordmark.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050b18"/><stop offset=".52" stop-color="#10294a"/><stop offset="1" stop-color="#07111f"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#36e4ff"/><stop offset="1" stop-color="#7b61ff"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#31dfff" stop-opacity=".35"/><stop offset="1" stop-color="#31dfff" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/>
<circle cx="930" cy="150" r="180" fill="url(#glow)"/>
<g fill="none" stroke="#35dff9" stroke-opacity=".22"><path d="M0 280H1200M0 310H1200M0 340H1200M120 220L300 360M280 220L460 360M440 220L620 360M600 220L780 360M760 220L940 360M920 220L1100 360M1080 220L1200 315"/></g>
<g transform="translate(760 58)">
 <g fill="none" stroke="url(#neon)" stroke-width="2" opacity=".75">
  <circle cx="160" cy="115" r="82"><animate attributeName="r" values="75;95;75" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="160" cy="115" r="110" stroke-dasharray="8 13"><animateTransform attributeName="transform" type="rotate" from="0 160 115" to="360 160 115" dur="32s" repeatCount="indefinite"/></circle>
 </g>
 <g transform="translate(78 84)">
  <rect x="0" y="30" width="80" height="58" rx="8" fill="#0b172b" stroke="#37dff8" stroke-width="2"/>
  <rect x="12" y="40" width="56" height="32" rx="3" fill="#102e4c"/>
  <path d="M20 62l10-10 10 7 12-15 8 5" fill="none" stroke="#48e7ff" stroke-width="3" stroke-linecap="round"/>
  <path d="M40 88v12m-18 0h36" stroke="#37dff8" stroke-width="3" stroke-linecap="round"/>
  <rect x="96" y="0" width="80" height="58" rx="8" fill="#0b172b" stroke="#8876ff" stroke-width="2"/>
  <rect x="108" y="10" width="56" height="32" rx="3" fill="#211d49"/>
  <path d="M116 30h8l7-10 8 14 8-8h8" fill="none" stroke="#b7aaff" stroke-width="3" stroke-linecap="round"/>
  <path d="M136 58v12m-18 0h36" stroke="#8876ff" stroke-width="3" stroke-linecap="round"/>
 </g>
 <circle cx="160" cy="115" r="7" fill="#fff"><animate attributeName="opacity" values=".4;1;.4" dur="2s" repeatCount="indefinite"/></circle>
</g>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
 <text x="76" y="83" fill="#59e7ff" font-size="16" font-weight="700" letter-spacing="5">PERSONAL AI WORKSPACE</text>
 <text x="72" y="151" fill="#ffffff" font-size="51" font-weight="800">MAZKIPLAY</text>
 <text x="76" y="202" fill="#d9e9ff" font-size="30" font-weight="600">AGENT OFFICE</text>
 <rect x="76" y="232" width="280" height="3" rx="2" fill="url(#neon)"/>
 <text x="76" y="265" fill="#9bb9d9" font-size="17">Plan • Build • Test • Review</text>
 <text x="76" y="310" fill="#5de5ff" font-size="14" letter-spacing="2">BY.MAZK1PLAY</text>
</g>
</svg>