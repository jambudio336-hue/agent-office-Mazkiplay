name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'README.md'
      - 'docs/features.md'
      - 'docs/android-apk.md'
      - 'docs/termux-shell-bridge.md'
      - 'tests/android-wrapper.test.ts'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'README.md'
      - 'docs/features.md'
      - 'docs/android-apk.md'
      - 'docs/termux-shell-bridge.md'
      - 'tests/android-wrapper.test.ts'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true
      - name: Build installable debug APK
        run: android/gradlew --no-daemon -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: m4zkiplay-agent-office-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish-test-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-debug-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: m4zkiplay-agent-office-android-debug
          path: release
      - name: Publish installable test APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-test-${{ github.run_number }}
        run: |
          gh release create "$TAG" release/app-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Mazkiplay Pentester AI Android test build ${{ github.run_number }}" \
            --notes "Installable debug-signed test APK for device validation. Not a production-signed release. Verify the source commit and test before relying on security features." \
            --latest=false
