name: Android APK Public Release

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'README.md'
      - 'docs/features.md'
      - 'docs/android-apk.md'
      - 'docs/termux-shell-bridge.md'
      - 'tests/android-wrapper.test.ts'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'README.md'
      - 'docs/features.md'
      - 'docs/android-apk.md'
      - 'docs/termux-shell-bridge.md'
      - 'tests/android-wrapper.test.ts'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true
      - name: Build installable release APK
        run: android/gradlew --no-daemon -p android assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: m4zkiplay-agent-office-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  publish-public-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-debug-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: m4zkiplay-agent-office-android-debug
          path: release
      - name: Publish installable release APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-v0.1.${{ github.run_number }}
        run: |
          gh release create "$TAG" release/app-release.apk \
            --target "$GITHUB_SHA" \
            --title "Mazkiplay Agent Office Android v0.1.${{ github.run_number }}" \
            --notes "Publicly downloadable Android release-variant APK built from main for installation and device testing. This build uses the standard debug signing key because no private production signing key is configured; it is not a production-signed app. Verify the source commit and test before relying on security features." \
            --latest=false
