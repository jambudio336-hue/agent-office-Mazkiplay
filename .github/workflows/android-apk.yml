name: Android APK

on:
  push:
    branches:
      - feat/android-office-apk
      - feat/free-local-ai-mode
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publikasikan APK mandiri sebagai GitHub Release publik"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Periksa proyek utama
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Validasi modul APK mandiri
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import vm from 'node:vm';
          const app = readFileSync('android-standalone/app.js', 'utf8');
          const patch = readFileSync('android-standalone/github-pr.js', 'utf8');
          const html = readFileSync('android-standalone/index.html', 'utf8');
          const css = readFileSync('android-standalone/github-pr.css', 'utf8');
          new vm.Script(app, { filename: 'android-standalone/app.js' });
          new vm.Script(patch, { filename: 'android-standalone/github-pr.js' });
          const ids = [...html.matchAll(/\bid="([^"]+)"/g)].map(match => match[1]);
          const duplicates = ids.filter((id, index) => ids.indexOf(id) !== index);
          if (duplicates.length) throw new Error('ID HTML duplikat: ' + [...new Set(duplicates)].join(', '));
          for (const id of ['multi-pr-paths', 'multi-pr-load', 'multi-pr-instruction', 'multi-pr-generate', 'multi-pr-editors', 'multi-pr-branch', 'multi-pr-create', 'model-id', 'model-options', 'discover-models', 'free-models-only', 'ai-mode', 'ai-mode-status', 'free-chat-form', 'free-chat-input', 'free-chat-output']) {
            if (!html.includes('id="' + id + '"')) throw new Error('Kontrol UI hilang: ' + id);
          }
          for (const ref of ['./github-pr.js', './github-pr.css']) {
            if (!html.includes(ref)) throw new Error('Referensi modul hilang: ' + ref);
          }
          if (!patch.includes('window.mazkiplayGenerateMultiPatch') || !app.includes('window.mazkiplayGenerateMultiPatch')) {
            throw new Error('Integrasi AI multi-file belum tersambung.');
          }
          if (!css.includes('.multi-file-editor')) throw new Error('CSS editor multi-file hilang.');
          if (!app.includes('function discoverModels()') || !app.includes('openrouter/free') || !app.includes('models?')) throw new Error('Penemuan model AI belum lengkap.');
          if (!app.includes('function localLiteAnswer(') || !app.includes('data.aiMode===\"local\"') || !html.includes('Gratis Lokal — tanpa API key')) throw new Error('Mode lokal gratis belum tersambung.');
          console.log('Validasi APK mandiri lulus: sintaks, ID HTML, modul, dan UI multi-file.');
          NODE

      - name: Siapkan Capacitor untuk aplikasi lokal
        run: |
          npm install --no-save @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7

      - name: Buat konfigurasi Android tanpa server hosting
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync('capacitor.config.json', JSON.stringify({
            appId: 'id.mazkiplay.agentoffice',
            appName: 'Mazkiplay Agent Office',
            webDir: 'android-standalone',
            android: { allowMixedContent: false },
            plugins: { CapacitorHttp: { enabled: true } }
          }, null, 2) + '\n');
          NODE
          npx cap add android
          mkdir -p android/app/src/main/java/id/mazkiplay/agentoffice
          cp android-standalone/native-android/src/main/java/id/mazkiplay/agentoffice/MazkiplaySecureStoragePlugin.java android/app/src/main/java/id/mazkiplay/agentoffice/
          cp android-standalone/native-android/src/main/java/id/mazkiplay/agentoffice/MainActivity.java android/app/src/main/java/id/mazkiplay/agentoffice/
          npx cap sync android

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p ../apk-output
          cp app/build/outputs/apk/debug/app-debug.apk ../apk-output/Mazkiplay-Agent-Office.apk

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mazkiplay-Agent-Office-Android-APK
          path: apk-output/Mazkiplay-Agent-Office.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publikasikan GitHub Release (opsional)
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-standalone-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" apk-output/Mazkiplay-Agent-Office.apk \
            --title "Mazkiplay Agent Office Android ${GITHUB_RUN_NUMBER}" \
            --notes "APK Android mandiri versi prototipe. UI kantor, profil pekerja dan task board berjalan lokal; integrasi provider AI memerlukan internet/API key. Terminal coding agent, eksekusi AI otonom dan integrasi panggilan/SMS belum tersedia di versi ini." \
            --latest
