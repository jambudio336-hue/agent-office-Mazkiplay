name: Android APK

on:
  push:
    branches:
      - feat/android-office-apk
      - feat/free-local-ai-mode
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publikasikan APK mandiri sebagai GitHub Release publik"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Periksa proyek utama
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Siapkan aset intro gambar dan audio
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg librsvg2-bin
          mkdir -p android-standalone/assets
          cat > /tmp/mazkiplay-intro.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
            <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030817"/><stop offset=".5" stop-color="#142d58"/><stop offset="1" stop-color="#240d2d"/></linearGradient><linearGradient id="blade"><stop stop-color="#fff"/><stop offset=".5" stop-color="#51eaff"/><stop offset="1" stop-color="#a3b8ff"/></linearGradient><radialGradient id="glow"><stop stop-color="#087dff" stop-opacity=".7"/><stop offset="1" stop-color="#00112a" stop-opacity="0"/></radialGradient></defs>
            <rect width="1280" height="720" fill="url(#bg)"/><circle cx="1030" cy="140" r="310" fill="url(#glow)"/><circle cx="170" cy="590" r="330" fill="url(#glow)"/>
            <g stroke="#1b70bb" stroke-width="2" opacity=".45"><path d="M0 120H1280M0 210H1280M0 300H1280M0 390H1280M0 480H1280M0 570H1280M80 0V720M180 0V720M280 0V720M1000 0V720M1100 0V720M1200 0V720"/></g>
            <g transform="translate(350 115)"><path d="M-120 120L-60 -30L45 -60L130 20L85 140L-15 185Z" fill="#111a30" stroke="#ff315c" stroke-width="8"/><path d="M-70 -25L0 -100L85 -60L120 10L55 55L-10 25Z" fill="#1c2945" stroke="#78eaff" stroke-width="5"/><path d="M-70 -85L-25 -150L20 -105L65 -135L55 -60" fill="none" stroke="#ff315c" stroke-width="15"/><path d="M-115 135L-180 220L-80 190L-30 115" fill="#cf1f4e"/><path d="M-15 70L440 240L65 100Z" fill="url(#blade)" stroke="#eafcff" stroke-width="4"/><circle cx="-5" cy="68" r="25" fill="#d7b06c" stroke="#fff" stroke-width="4"/></g>
            <g transform="translate(875 165)"><path d="M0 0Q95 -85 180 0L210 145L145 250L35 235L-20 135Z" fill="#392047" stroke="#a64eea" stroke-width="7"/><ellipse cx="90" cy="55" rx="74" ry="92" fill="#e8d8d1"/><path d="M20 15Q-5 -70 95 -65Q180 -55 165 25L135 2L110 -25L55 5Z" fill="#171424"/><path d="M50 55L72 68L92 55M112 55L132 68L151 55" fill="none" stroke="#cf234f" stroke-width="9"/><path d="M65 112Q100 142 139 108" fill="none" stroke="#b72b4c" stroke-width="8"/><path d="M-10 155L-90 220L0 210L35 240" fill="#24142e"/></g>
            <path d="M0 590L1280 590L1280 720L0 720Z" fill="#030914" fill-opacity=".88"/><text x="640" y="625" text-anchor="middle" font-family="sans-serif" font-size="24" letter-spacing="8" fill="#7cecff">WELCOME TO</text><text x="640" y="674" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="900" fill="#f5fbff">MAZKIPLAY AGENT OFFICE</text><text x="640" y="705" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#66dfff">Tempat para agen AI bekerja untukmu</text>
          </svg>
          SVG
          rsvg-convert -o android-standalone/assets/mazkiplay-intro.png -f png -w 1280 -h 720 /tmp/mazkiplay-intro.svg
          espeak-ng -v id -s 142 -p 68 -a 175 -w /tmp/welcome.wav "Selamat datang di kantor Mazkiplay Agent Office. Tempat para agen AI bekerja untukmu."
          ffmpeg -y -i /tmp/welcome.wav -f lavfi -i "sine=frequency=1450:duration=0.22" -f lavfi -i "sine=frequency=540:duration=0.35" -filter_complex "[1:a]afade=t=out:st=0.08:d=0.14,volume=0.14[s1];[2:a]afade=t=out:st=0.12:d=0.23,volume=0.10[s2];[0:a]adelay=350|350,volume=1.0[v];[v][s1][s2]amix=inputs=3:duration=longest,highpass=f=100,lowpass=f=7000,loudnorm=I=-16:TP=-1.5:LRA=11[out]" -map "[out]" -codec:a libmp3lame -b:a 128k android-standalone/assets/intro-welcome.mp3
          test -s android-standalone/assets/mazkiplay-intro.png
          test -s android-standalone/assets/intro-welcome.mp3

      - name: Validasi modul APK mandiri
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import vm from 'node:vm';
          const app = readFileSync('android-standalone/app.js', 'utf8');
          const patch = readFileSync('android-standalone/github-pr.js', 'utf8');
          const selfImprovement = readFileSync('android-standalone/self-improvement.js', 'utf8');
          const intro = readFileSync('android-standalone/intro.js', 'utf8');
          const html = readFileSync('android-standalone/index.html', 'utf8');
          const css = readFileSync('android-standalone/github-pr.css', 'utf8');
          const officeCss = readFileSync('android-standalone/styles.css', 'utf8');
          if (!officeCss.includes('Hybrid HQ visual refresh') || !officeCss.includes('worker-idle') || !officeCss.includes('images.unsplash.com')) throw new Error('Visual hybrid HQ atau animasi pekerja hilang.');
          new vm.Script(app, { filename: 'android-standalone/app.js' });
          new vm.Script(patch, { filename: 'android-standalone/github-pr.js' });
          new vm.Script(selfImprovement, { filename: 'android-standalone/self-improvement.js' });
          new vm.Script(intro, { filename: 'android-standalone/intro.js' });
          if (!html.includes('id=\"intro-screen\"') || !html.includes('id=\"intro-audio\"') || !html.includes('id=\"intro-skip\"') || !html.includes('./intro.js')) throw new Error('Startup intro overlay is not wired into the APK HTML.');
          if (!intro.includes('intro-welcome.mp3') || !intro.includes('audio.addEventListener("ended", finish') || !intro.includes('skip.addEventListener("click", finish)')) throw new Error('Startup intro playback, completion, or skip flow is missing.');
          if (!html.includes('./self-improvement.js') || !selfImprovement.includes('SELF-IMPROVEMENT ENGINE') || !selfImprovement.includes('unhandledrejection')) throw new Error('Self-improvement monitor tidak tersambung atau tidak mencatat promise rejection.');
          if (!selfImprovement.includes('Tidak ada perubahan kode diam-diam') && !selfImprovement.includes('tidak mengubah kode')) throw new Error('Batas keamanan self-improvement tidak terdokumentasi.');
          for (const feature of ['function makePlan()', 'self-plan-work', 'self-feature-scan', 'self-qa-plan', 'self-skill-search', 'self-skill-use', 'self-release-checks', 'data-release-check', 'data-plan-task']) {
            if (!selfImprovement.includes(feature)) throw new Error('Fitur self-improvement hilang: ' + feature);
          }
          if (!officeCss.includes('.self-release-checks') || !officeCss.includes('#self-skill-search')) throw new Error('CSS planner, pustaka pengetahuan, atau gerbang QA hilang.');
          const ids = [...html.matchAll(/\bid="([^"]+)"/g)].map(match => match[1]);
          const duplicates = ids.filter((id, index) => ids.indexOf(id) !== index);
          if (duplicates.length) throw new Error('ID HTML duplikat: ' + [...new Set(duplicates)].join(', '));
          for (const id of ['multi-pr-paths', 'multi-pr-load', 'multi-pr-instruction', 'multi-pr-generate', 'multi-pr-editors', 'multi-pr-branch', 'multi-pr-create', 'model-id', 'model-options', 'discover-models', 'free-models-only', 'ai-mode', 'ai-mode-status', 'free-chat-form', 'free-chat-input', 'free-chat-output', 'local-llm-download', 'local-llm-prepare', 'local-llm-reset', 'local-llm-progress', 'local-llm-status']) {
            if (!html.includes('id="' + id + '"')) throw new Error('Kontrol UI hilang: ' + id);
          }
          for (const ref of ['./github-pr.js', './github-pr.css']) {
            if (!html.includes(ref)) throw new Error('Referensi modul hilang: ' + ref);
          }
          if (!patch.includes('window.mazkiplayGenerateMultiPatch') || !app.includes('window.mazkiplayGenerateMultiPatch')) {
            throw new Error('Integrasi AI multi-file belum tersambung.');
          }
          if (!css.includes('.multi-file-editor')) throw new Error('CSS editor multi-file hilang.');
          if (!app.includes('function discoverModels()') || !app.includes('openrouter/free') || !app.includes('models?')) throw new Error('Penemuan model AI belum lengkap.');
          if (!app.includes('benchmark-provider') || !app.includes('data.aiBenchmarks') || !html.includes('id="benchmark-provider"')) throw new Error('Benchmark provider AI belum tersambung.');
          if (!app.includes('async function callModelWithFallback') || !app.includes('data.autoProviderFallback') || !html.includes('id="auto-provider-fallback"')) throw new Error('Fallback provider AI belum tersambung.');
          if (!app.includes('function localLiteAnswer(') || !app.includes('data.aiMode===\"local\"') || !html.includes('Gratis Lokal — tanpa API key')) throw new Error('Mode lokal gratis belum tersambung.');
          if (!app.includes('async function generateLocalAnswer(') || !app.includes('await generateLocalAnswer(prompt,worker?.role||\"Asisten umum\")')) throw new Error('Task Board belum menggunakan LLM lokal native saat tersedia.');
          if (!app.includes('await callModelWithFallback(providerId,prompt,$("free-chat-role").value,1200)')) throw new Error('Chat API Mode belum diarahkan ke provider terpilih dan fallback opsional.');
          if (!app.includes('Chat, Task Board, dan Patch Lab menggunakan provider API yang dipilih')) throw new Error('Keterangan UI Mode API tidak sesuai dengan routing chat.');
          const localLlm = readFileSync('android-standalone/native-android/src/main/java/id/mazkiplay/agentoffice/MazkiplayLocalLLMPlugin.kt', 'utf8');
          if (!localLlm.includes('com.google.ai.edge.litertlm.Engine') || !localLlm.includes('fun generate(call: PluginCall)') || !localLlm.includes('MODEL_URL')) throw new Error('Integrasi native LLM lokal belum lengkap.');
          if (!html.includes('local-llm-download') || !html.includes('local-llm-status')) throw new Error('UI pengelola model generatif belum lengkap.');
          if (!app.includes('MAX_TASKS=500') || !app.includes('data.tasks.length>=MAX_TASKS')) throw new Error('Batas aman jumlah tugas tidak diterapkan.');
          if (!app.includes('backup.tasks.length>MAX_TASKS') || !app.includes('ID pekerja duplikat') || !app.includes('ID tugas duplikat')) throw new Error('Validasi integritas backup belum lengkap.');
          if (!app.includes('API key tidak ikut diekspor') || !app.includes('Impor akan mengganti daftar pekerja dan tugas saat ini')) throw new Error('Peringatan privasi atau konfirmasi impor backup hilang.');
          console.log('Validasi APK mandiri lulus: sintaks, ID HTML, modul, dan UI multi-file.');
          NODE

      - name: Siapkan Capacitor untuk aplikasi lokal
        run: |
          npm install --no-save @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7

      - name: Buat konfigurasi Android tanpa server hosting
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync('capacitor.config.json', JSON.stringify({
            appId: 'id.mazkiplay.agentoffice',
            appName: 'Mazkiplay Agent Office',
            webDir: 'android-standalone',
            android: { allowMixedContent: false },
            plugins: { CapacitorHttp: { enabled: true } }
          }, null, 2) + '\n');
          NODE
          npx cap add android
          mkdir -p android/app/src/main/java/id/mazkiplay/agentoffice
          cp android-standalone/native-android/src/main/java/id/mazkiplay/agentoffice/MazkiplaySecureStoragePlugin.java android/app/src/main/java/id/mazkiplay/agentoffice/
          cp android-standalone/native-android/src/main/java/id/mazkiplay/agentoffice/MazkiplayLocalLLMPlugin.kt android/app/src/main/java/id/mazkiplay/agentoffice/
          cp android-standalone/native-android/src/main/java/id/mazkiplay/agentoffice/MainActivity.java android/app/src/main/java/id/mazkiplay/agentoffice/
          cp android-standalone/native-android/src/main/java/id/mazkiplay/agentoffice/MazkiplayDeviceBridgePlugin.java android/app/src/main/java/id/mazkiplay/agentoffice/
          cp android-standalone/native-android/src/main/java/id/mazkiplay/agentoffice/MazkiplayAccessibilityService.java android/app/src/main/java/id/mazkiplay/agentoffice/
          mkdir -p android/app/src/main/res/xml android/app/src/main/res/values
          cp android-standalone/native-android/src/main/res/xml/mazkiplay_accessibility_service.xml android/app/src/main/res/xml/
          cp android-standalone/native-android/src/main/res/values/mazkiplay_accessibility_strings.xml android/app/src/main/res/values/
          python3 <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          service = '''
              <service
                  android:name="id.mazkiplay.agentoffice.MazkiplayAccessibilityService"
                  android:label="Mazkiplay Assistive Screen Summary"
                  android:description="@string/mazkiplay_accessibility_description"
                  android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.accessibilityservice.AccessibilityService" />
                  </intent-filter>
                  <meta-data
                      android:name="android.accessibilityservice"
                      android:resource="@xml/mazkiplay_accessibility_service" />
              </service>
          '''
          if 'id.mazkiplay.agentoffice.MazkiplayAccessibilityService' not in text:
              if '</application>' not in text:
                  raise SystemExit('Android manifest has no application element')
              text = text.replace('</application>', service + '\n</application>', 1)
              manifest.write_text(text)
          assert 'android.permission.BIND_ACCESSIBILITY_SERVICE' in manifest.read_text()
          print('User-enabled assistive accessibility service registered.')
          PY
          npx cap sync android

      - name: Siapkan Kotlin dan LiteRT-LM untuk AI generatif offline
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          root = Path('android')
          top = root / 'build.gradle'
          app = root / 'app' / 'build.gradle'
          wrapper = root / 'gradle' / 'wrapper' / 'gradle-wrapper.properties'
          s = top.read_text()
          s = re.sub(r"com\.android\.tools\.build:gradle:[^'\"]+", "com.android.tools.build:gradle:8.13.2", s)
          if 'org.jetbrains.kotlin:kotlin-gradle-plugin:' in s:
              s = re.sub(r"org\.jetbrains\.kotlin:kotlin-gradle-plugin:[^'\"]+", "org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.0", s)
          else:
              s = re.sub(r"(dependencies\s*\{)", r"\1\n        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.0'", s, count=1)
          top.write_text(s)
          a = app.read_text()
          if "apply plugin: 'org.jetbrains.kotlin.android'" not in a:
              a = a.replace("apply plugin: 'com.android.application'", "apply plugin: 'com.android.application'\napply plugin: 'org.jetbrains.kotlin.android'", 1)
          if 'litertlm-android' not in a:
              a = re.sub(r"dependencies\s*\{", "dependencies {\n    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.18.0'\n    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'", a, count=1)
          if 'kotlinOptions { jvmTarget' not in a:
              a = a.replace('android {', "android {\n    kotlinOptions { jvmTarget = '21' }", 1)
          app.write_text(a)
          w = wrapper.read_text()
          w = re.sub(r'gradle-[0-9.]+-(?:all|bin)\.zip', 'gradle-8.13-all.zip', w)
          wrapper.write_text(w)
          variables = root / 'variables.gradle'
          if variables.exists():
              v = variables.read_text()
              v = re.sub(r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 24', v)
              variables.write_text(v)
          manifest = root / 'app' / 'src' / 'main' / 'AndroidManifest.xml'
          m = manifest.read_text()
          if 'android.permission.INTERNET' not in m:
              m = re.sub(r'(<manifest[^>]*>)', r'\1\n    <uses-permission android:name="android.permission.INTERNET"/>', m, count=1)
          manifest.write_text(m)
          assert 'litertlm-android:0.18.0' in app.read_text(), 'LiteRT-LM dependency was not added'
          assert 'org.jetbrains.kotlin.android' in app.read_text(), 'Kotlin Android plugin was not applied'
          assert 'gradle-8.13-all.zip' in wrapper.read_text(), 'Gradle wrapper was not upgraded'
          print('LiteRT-LM, Kotlin plugin, Gradle, and model download permission configured.')
          PY

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p ../apk-output
          cp app/build/outputs/apk/debug/app-debug.apk ../apk-output/Mazkiplay-Agent-Office.apk

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mazkiplay-Agent-Office-Android-APK
          path: apk-output/Mazkiplay-Agent-Office.apk
          if-no-files-found: error
          retention-days: 30

      - name: Siapkan checksum APK
        run: |
          cd apk-output
          sha256sum Mazkiplay-Agent-Office.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publikasikan GitHub Release publik
        if: inputs.publish_release || (github.event_name == 'push' && github.ref == 'refs/heads/feat/free-local-ai-mode')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-standalone-${GITHUB_RUN_NUMBER}"
          notes="Mazkiplay Agent Office — APK Android standalone. Berisi UI kantor, profil pekerja, Task Board, koneksi provider AI, AI lokal Qwen3 setelah model diunduh, GitHub workspace, dan modul monitor/perencana perbaikan. Provider cloud membutuhkan internet/API key dan dapat memakai kuota/biaya. AI tidak mengedit kode diam-diam; perubahan kode tetap perlu review, tes, dan build tervalidasi. Belum diverifikasi pada perangkat Android fisik; gunakan sebagai preview publik dan laporkan bug melalui Issues."
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            gh release create "$tag" apk-output/Mazkiplay-Agent-Office.apk apk-output/SHA256SUMS.txt \
              --title "Mazkiplay Agent Office Android ${GITHUB_RUN_NUMBER} Preview" \
              --notes "$notes" --prerelease
          else
            gh release create "$tag" apk-output/Mazkiplay-Agent-Office.apk apk-output/SHA256SUMS.txt \
              --title "Mazkiplay Agent Office Android ${GITHUB_RUN_NUMBER}" \
              --notes "$notes" --latest
          fi
