<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030812"><title>Mazkiplay</title>
<style>
:root{color-scheme:dark;--cyan:#65eaff;--green:#7cffbd;--bg:#030812}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#102b49 0,#071323 36%,var(--bg) 75%);font-family:system-ui,sans-serif}
main{height:100%;display:grid;place-items:center;position:relative;isolation:isolate}
main:before,main:after{content:"";position:absolute;border:1px solid #5bdfff22;border-radius:50%;width:min(78vw,440px);aspect-ratio:1;animation:rotate 28s linear infinite;z-index:-1}
main:after{width:min(92vw,520px);border-style:dashed;animation-direction:reverse;animation-duration:45s}
.core{width:min(54vw,270px);aspect-ratio:1;border-radius:50%;position:relative;display:grid;place-items:center;cursor:pointer;border:1px solid #8beeffaa;background:radial-gradient(circle at 35% 28%,#e9fdff 0,#68dcff 5%,#1c6e9d 20%,#0b2541 52%,#06101e 72%);box-shadow:0 0 25px #49dfff88,0 0 90px #168bd455,inset 0 0 35px #a3f4ff55;transition:.3s}
.core:before,.core:after{content:"";position:absolute;inset:-15px;border:1px solid #69e9ff77;border-radius:50%;animation:pulse 2.8s ease-out infinite}
.core:after{inset:-31px;animation-delay:1.4s}
.core svg{width:28%;height:28%;filter:drop-shadow(0 0 12px #c9fbff)}
.listening .core{border-color:var(--green);box-shadow:0 0 35px #7cffbd99,0 0 110px #28d88b55,inset 0 0 45px #b5ffdb66}
.listening .core:before,.listening .core:after{border-color:#7cffbd}
.speaking .core{animation:voice .24s ease-in-out infinite alternate}
.actions{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));display:flex;gap:20px}
button{width:52px;height:52px;border-radius:50%;border:1px solid #5bdfff66;background:#071a2bcc;color:#baf6ff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(12px)}
button svg{width:22px;height:22px}button:active{transform:scale(.94)}
@keyframes pulse{0%{transform:scale(.92);opacity:.8}100%{transform:scale(1.23);opacity:0}}
@keyframes rotate{to{transform:rotate(360deg)}}
@keyframes voice{from{transform:scale(.98)}to{transform:scale(1.035)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}
</style>
</head>
<body>
<main id="stage">
<button id="core" class="core" aria-label="Mulai atau hentikan percakapan suara dengan Mazkiplay">
<svg viewBox="0 0 24 24" fill="none" stroke="#eaffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20M2 12h20M4.9 4.9l14.2 14.2M19.1 4.9 4.9 19.1"/><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.4" fill="#eaffff"/></svg>
</button>
<div class="actions">
<button id="mic" aria-label="Aktifkan mikrofon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></svg></button>
<button id="stop" aria-label="Hentikan suara dan mikrofon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"/></svg></button>
</div>
</main>
<script>
(()=> {
const stage=document.getElementById('stage'),core=document.getElementById('core'),mic=document.getElementById('mic'),stopButton=document.getElementById('stop');
const SETTINGS_KEY='mazkiplay.ai.settings.v1';
const defaults={provider:'openrouter',apiKey:'',model:'openai/gpt-4o-mini',baseUrl:'https://openrouter.ai/api/v1',name:'Mazkiplay',tone:'Seimbang',language:'Indonesia'};
let settings;try{settings={...defaults,...JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')}}catch{settings=defaults}
let recognition=null,active=false,busy=false,manuallyStopped=false;
const history=[];
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
function speak(text){
 if(!('speechSynthesis'in window)){return}
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='id-ID';u.rate=.94;u.pitch=1.02;
 const voices=speechSynthesis.getVoices();const id=voices.filter(v=>/^id[-_]ID$/i.test(v.lang));
 if(id.length){const maleLike=id.find(v=>/male|pria|andika|dimas|arif/i.test(v.name));u.voice=maleLike||id[0]}
 u.onstart=()=>{stage.classList.add('speaking');stage.classList.remove('listening')};
 u.onend=()=>{stage.classList.remove('speaking');if(active&&!manuallyStopped)startRecognition()};
 u.onerror=()=>{stage.classList.remove('speaking');if(active&&!manuallyStopped)startRecognition()};
 speechSynthesis.speak(u);
}
function sayError(){speak('Maaf, Captain. Saya belum bisa memproses permintaan itu. Periksa koneksi dan pengaturan model AI.')}
async function ask(text){
 if(busy)return;busy=true;stage.classList.remove('listening');
 if(recognition){try{recognition.stop()}catch{}}
 try{
  if(settings.provider==='offline'){speak('Mode AI offline dasar belum mendukung percakapan bebas. Hubungkan model AI agar saya bisa menjawab pertanyaan dengan lengkap.');return}
  if(settings.provider!=='local'&&!settings.apiKey){speak('Model AI belum dikonfigurasi. Masukkan API key melalui pengaturan aplikasi utama terlebih dahulu.');return}
  const base=settings.provider==='openai'?'https://api.openai.com/v1':(settings.baseUrl||'https://openrouter.ai/api/v1');
  if(!settings.model){speak('Model AI belum dipilih.');return}
  history.push({role:'user',content:text});if(history.length>16)history.splice(0,history.length-16);
  const messages=[{role:'system',content:'Nama kamu Mazkiplay, asisten suara JARVIS. Berbicaralah alami dalam Bahasa Indonesia seperti asisten pria muda, ringkas namun lengkap. Jawaban akan dibacakan dengan suara, jadi jangan gunakan markdown, daftar simbol, emoji, atau format visual. Sapa pengguna dengan Captain bila sesuai. Jangan mengaku telah melakukan tindakan yang belum dilakukan. Untuk keamanan siber, bantu hanya kegiatan legal dan berizin.'},...history];
  const response=await fetch(base.replace(/\/$/, '')+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',...(settings.apiKey?{'Authorization':'Bearer '+settings.apiKey}:{}),...(settings.provider==='openrouter'?{'HTTP-Referer':location.origin,'X-Title':'Mazkiplay JARVIS'}:{})},body:JSON.stringify({model:settings.model,messages,temperature:.65})});
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(data.error?.message||'AI request failed');
  const answer=data.choices?.[0]?.message?.content;
  const clean=typeof answer==='string'?answer.trim():Array.isArray(answer)?answer.map(x=>x.text||'').join(' ').trim():'';
  if(!clean)throw new Error('Empty response');
  history.push({role:'assistant',content:clean});if(history.length>16)history.splice(0,history.length-16);
  speak(clean);
 }catch(e){sayError()}finally{busy=false}
}
function startRecognition(){
 if(!active||manuallyStopped||busy)return;
 if(!SpeechRecognition){speak('Fitur pengenalan suara tidak didukung browser ini. Gunakan Chrome Android terbaru dan izinkan akses mikrofon.');active=false;return}
 if(recognition){try{recognition.abort()}catch{}}
 recognition=new SpeechRecognition();recognition.lang='id-ID';recognition.continuous=false;recognition.interimResults=false;recognition.maxAlternatives=1;
 recognition.onstart=()=>{stage.classList.add('listening');stage.classList.remove('speaking')};
 recognition.onresult=e=>{const text=e.results?.[e.results.length-1]?.[0]?.transcript?.trim();if(text)ask(text)};
 recognition.onerror=e=>{stage.classList.remove('listening');if(e.error==='not-allowed'||e.error==='service-not-allowed'){active=false;manuallyStopped=true;speak('Izin mikrofon belum diberikan. Silakan izinkan mikrofon pada pengaturan browser.')}else if(active&&!manuallyStopped&&!busy){setTimeout(startRecognition,700)}};
 recognition.onend=()=>{stage.classList.remove('listening');if(active&&!manuallyStopped&&!busy&&!speechSynthesis.speaking)setTimeout(startRecognition,350)};
 try{recognition.start()}catch{if(active&&!manuallyStopped)setTimeout(startRecognition,900)}
}
async function start(){
 if(active)return;manuallyStopped=false;
 try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});stream.getTracks().forEach(t=>t.stop());active=true;startRecognition()}
 catch{active=false;speak('Akses mikrofon ditolak. Berikan izin mikrofon untuk mulai berbicara dengan saya.')}
}
function stop(){active=false;manuallyStopped=true;busy=false;stage.classList.remove('listening','speaking');if(recognition){try{recognition.abort()}catch{}}if('speechSynthesis'in window)speechSynthesis.cancel()}
core.addEventListener('click',()=>active?stop():start());mic.addEventListener('click',start);stopButton.addEventListener('click',stop);
window.addEventListener('pagehide',stop);
if('speechSynthesis'in window)speechSynthesis.getVoices();
})();
</script>
</body></html>
